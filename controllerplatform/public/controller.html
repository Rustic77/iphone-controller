<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control Relay — Controller</title>
<link rel="stylesheet" href="/app.css" />

<header>
  <h1><a href="/" style="text-decoration:none;color:inherit">← Devices</a></h1>
  <div class="row" style="flex-wrap:wrap;justify-content:flex-end">
    <span class="status-pill" id="pillControl"><span class="dot" id="dotControl"></span>CONTROL <span id="txtControl">…</span></span>
    <span class="status-pill" id="pillHid"><span class="dot" id="dotHid"></span>HID <span id="txtHid">…</span></span>
  </div>
</header>

<main class="controller-main">
  <div class="card">
    <div class="row">
      <strong id="deviceName">device</strong>
      <div class="spacer"></div>
      <button id="releaseAll" class="danger">■ RELEASE ALL</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="pad" class="trackpad">Trackpad · drag to move · tap to click · two-finger / wheel scroll</div>

  <div class="controls">
    <button id="leftClick">Left click</button>
    <button id="rightClick">Right click</button>
    <div class="spacer"></div>
    <button id="scrollUp">Scroll ▲</button>
    <button id="scrollDown">Scroll ▼</button>
  </div>

  <div class="card" style="margin-top:14px">
    <label class="muted" for="textIn">Keyboard text entry</label>
    <div class="grid2" style="margin-top:8px">
      <input id="textIn" placeholder="Type text, press Enter to send" />
      <div class="row">
        <button id="sendText" class="primary">Send text</button>
        <button id="sendEnter">Enter ⏎</button>
        <button id="sendBksp">⌫ Backspace</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">Activity</div>
    <div id="log" class="log"></div>
  </div>
</main>

<script>
  const TOKEN_KEY = "relay.token";
  const $ = (id) => document.getElementById(id);
  const deviceId = new URLSearchParams(location.search).get("device");
  const token = localStorage.getItem(TOKEN_KEY);

  if (!token) location.href = "/";
  $("deviceName").textContent = deviceId || "unknown device";

  let seq = 1;
  let claimed = false;
  let ws;
  let status = {
    controllerOnline: false,
    hidReady: false,
  };

  function log(line) {
    const el = $("log");
    el.textContent += line + "\n";
    el.scrollTop = el.scrollHeight;
  }

  function setPill(dotId, txtId, on, onText, offText) {
    $(dotId).classList.toggle("online", !!on);
    $(txtId).textContent = on ? onText : offText;
  }

  function renderStatus() {
    setPill("dotControl", "txtControl", status.controllerOnline || claimed, "ONLINE", "OFFLINE");
    setPill("dotHid", "txtHid", status.hidReady || claimed, "Ready", "Not ready");
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function sendInput(event) {
    if (!claimed) return;
    send({ type: "input", seq: seq++, ts: Date.now(), event });
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/browser?token=${encodeURIComponent(token)}`);

    ws.onopen = () => {
      renderStatus();
      send({ type: "claim", deviceId });
    };
    ws.onclose = () => {
      claimed = false;
      status.controllerOnline = false;
      renderStatus();
      $("pad").classList.remove("active");
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case "devices": {
          const d = (msg.devices || []).find((x) => x.id === deviceId);
          if (d) {
            status.controllerOnline = !!d.controllerOnline || !!d.online;
            status.hidReady = !!d.hidReady;
            if (d.name) $("deviceName").textContent = d.name;
            renderStatus();
          }
          break;
        }
        case "claimed":
          claimed = true;
          status.controllerOnline = true;
          status.hidReady = true;
          seq = 1;
          log("claimed control (session " + msg.controlSessionId + ")");
          renderStatus();
          break;
        case "claim_failed":
          $("err").textContent = "Cannot control device: " + msg.reason;
          log("claim failed: " + msg.reason);
          renderStatus();
          break;
        case "device_status":
          if (!msg.online) {
            claimed = false;
            status.controllerOnline = false;
            status.hidReady = false;
            $("err").textContent = "Controller went offline.";
            $("pad").classList.remove("active");
            renderStatus();
          }
          break;
        case "released":
          claimed = false;
          status.hidReady = false;
          log("released control");
          renderStatus();
          break;
        case "error":
          log("server error: " + msg.reason);
          break;
      }
    };
  }

  const TAP_SLOP_PX = 10;

  function click(button) {
    sendInput({ kind: "click", button, pressed: true });
    sendInput({ kind: "click", button, pressed: false });
  }

  function bindTrackpad(el) {
    let last = null;
    let downAt = null;
    let dragging = false;
    let moved = false;

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      last = { x: e.clientX, y: e.clientY };
      downAt = { x: e.clientX, y: e.clientY };
      moved = false;
      el.classList.add("active");
    });

    el.addEventListener("pointermove", (e) => {
      if (!last) return;
      const dx = e.clientX - last.x;
      const dy = e.clientY - last.y;
      last = { x: e.clientX, y: e.clientY };
      if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > TAP_SLOP_PX) {
        moved = true;
      }
      if (dx || dy) sendInput({ kind: "move", dx, dy });
    });

    el.addEventListener("pointerup", (e) => {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      if (dragging) {
        sendInput({ kind: "click", button: "left", pressed: false });
        dragging = false;
      } else if (!moved && downAt) {
        click("left");
      }
      last = null;
      downAt = null;
      el.classList.remove("active");
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    el.addEventListener("pointercancel", () => {
      if (dragging) {
        sendInput({ kind: "click", button: "left", pressed: false });
        dragging = false;
      }
      last = null;
      downAt = null;
      el.classList.remove("active");
      sendInput({ kind: "release_all" });
    });

    el.addEventListener("dblclick", (e) => {
      e.preventDefault();
      dragging = true;
      sendInput({ kind: "click", button: "left", pressed: true });
      log("drag started (double-click to grab, release to drop)");
    });

    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      sendInput({ kind: "scroll", dx: Math.sign(e.deltaX), dy: -Math.sign(e.deltaY) });
    }, { passive: false });

    el.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  bindTrackpad($("pad"));

  $("leftClick").onclick = () => click("left");
  $("rightClick").onclick = () => click("right");
  $("scrollUp").onclick = () => sendInput({ kind: "scroll", dx: 0, dy: 3 });
  $("scrollDown").onclick = () => sendInput({ kind: "scroll", dx: 0, dy: -3 });

  $("sendText").onclick = () => {
    const t = $("textIn").value;
    if (t) sendInput({ kind: "text", text: t });
    $("textIn").value = "";
  };
  $("textIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("sendText").click(); });
  $("sendEnter").onclick = () => { sendInput({ kind: "key", code: "Enter", pressed: true }); sendInput({ kind: "key", code: "Enter", pressed: false }); };
  $("sendBksp").onclick = () => { sendInput({ kind: "key", code: "Backspace", pressed: true }); sendInput({ kind: "key", code: "Backspace", pressed: false }); };

  $("releaseAll").onclick = () => {
    sendInput({ kind: "release_all" });
    send({ type: "release_all" });
    log("EMERGENCY: release all sent");
  };

  window.addEventListener("beforeunload", () => { if (ws) ws.close(); });

  renderStatus();
  connect();
</script>
